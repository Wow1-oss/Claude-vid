<style>
:root{--pink:#ff2d7a;--pinkL:#ffc2d8;--yel:#ffe94a;--grn:#2fd17a;--grnL:#c9f7d6;--ink:#1d1b1a;--blue:#2f6fe4}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#000}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:"F Titan One",sans-serif}
#ground{position:absolute;inset:0;background:radial-gradient(120% 80% at 50% 40%,#f3e6d6,#cdb79f)}
#cam{position:absolute;inset:0;transform-origin:50% 38%}
#stage{position:absolute;inset:0;overflow:hidden}
#stage video{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
#warm{position:absolute;inset:0;mix-blend-mode:soft-light;opacity:.5;
  background:radial-gradient(700px 800px at 55% 30%,rgba(255,236,214,.8),rgba(255,236,214,0) 70%)}
#vig{position:absolute;inset:0;background:radial-gradient(130% 95% at 50% 42%,rgba(0,0,0,0) 58%,rgba(40,20,10,.35) 100%)}
#dim{position:absolute;inset:0;background:#20140e;opacity:0}

/* sticker captions */
.cap{position:absolute;left:0;right:0;margin:0 auto;width:fit-content;text-align:center;opacity:0}
.ln{display:block;width:fit-content;margin:0 auto 10px;opacity:0}
.st{display:inline-block;font-size:64px;line-height:1.08;color:var(--ink);background:#fff;padding:8px 28px 16px;border-radius:26px;
  box-shadow:0 10px 0 rgba(29,27,26,.16),0 18px 40px rgba(60,30,10,.25);border:5px solid #fff}
.st.big{font-size:84px}
.st.hl{background:var(--yel);border-color:#fff}
.st.pk{background:var(--pinkL);border-color:#fff}
.st.gr{background:var(--grnL);border-color:#fff}

/* icons */
.ic{position:absolute;opacity:0}
.burst{width:170px;height:170px}
#burst1{left:830px;top:250px}
#burst2{left:120px;top:520px}
#burst3{left:780px;top:300px}
#stamp{left:60px;top:300px;font-size:76px;color:#fff;background:var(--pink);padding:6px 30px 14px;border-radius:22px;border:7px solid #fff;box-shadow:0 14px 34px rgba(60,30,10,.3)}
#calico{left:60px;top:300px;width:230px;height:230px}
#bag{left:60px;top:560px;width:250px;height:280px}
#bubble{left:180px;top:330px;width:240px;height:210px}
#clip{left:60px;top:560px;width:240px;height:290px}
.qm{position:absolute;font-family:"F Archivo Black";font-size:150px;color:var(--pink);opacity:0;-webkit-text-stroke:6px #fff;paint-order:stroke fill}
#q1{left:270px;top:440px}#q2{left:20px;top:400px}#q3{left:290px;top:720px}

/* B-roll: auto-debit app card */
#broll{position:absolute;left:80px;top:300px;width:920px;height:690px;opacity:0}
#app{position:absolute;inset:0;background:#fffdf8;border-radius:44px;border:8px solid #fff;box-shadow:0 40px 90px rgba(40,20,10,.45);overflow:hidden}
#apphead{height:140px;background:linear-gradient(90deg,#2f6fe4,#5b8ff0);display:flex;align-items:center;gap:22px;padding:0 40px;color:#fff;font-size:50px}
#apphead svg{flex:0 0 96px}
#ex{position:absolute;right:40px;top:160px;font-family:"F Permanent Marker";font-size:34px;color:#2f6fe4}
#tog{position:absolute;left:44px;right:44px;top:210px;display:flex;justify-content:space-between;align-items:center;font-family:"F Archivo Black";font-size:40px;color:var(--ink)}
#sw{position:relative;width:150px;height:80px;border-radius:40px;background:#d9cfc6}
#knob{position:absolute;left:8px;top:8px;width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 4px 10px rgba(0,0,0,.25)}
#months{position:absolute;left:44px;right:44px;top:330px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.mo{height:96px;border-radius:20px;background:#f2ebe4;display:flex;align-items:center;justify-content:center;gap:10px;font-family:"F Archivo Black";font-size:32px;color:#8a7a70}
.mo svg{flex:0 0 34px;opacity:0}
#paid{position:absolute;left:44px;right:44px;top:560px;height:96px;border-radius:26px;background:var(--grnL);display:flex;align-items:center;gap:20px;padding:0 26px;font-family:"F Archivo Black";font-size:36px;color:#0d6b39;opacity:0}
#paid svg{flex:0 0 64px}
#shield2{position:absolute;right:-30px;top:-70px;width:200px;height:220px;opacity:0}

/* end card */
#end{position:absolute;left:0;right:0;top:1060px;text-align:center;opacity:0}
#end .p{display:inline-block;font-size:96px;color:var(--ink);background:var(--yel);padding:10px 46px 24px;border-radius:36px;border:8px solid #fff;box-shadow:0 20px 50px rgba(0,0,0,.35)}
#end .n{display:block;font-family:"F Permanent Marker";font-size:54px;color:#fff;margin-bottom:14px;text-shadow:0 4px 18px rgba(0,0,0,.5)}
#fbtn{position:relative;margin:34px auto 0;width:fit-content;font-size:54px;color:#fff;background:var(--pink);padding:16px 52px 24px;border-radius:60px;border:6px solid #fff;display:grid}
#fbtn span{grid-area:1/1;text-align:center}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
</style>
</head>

<script>
const FPS = 30, F = n => n / FPS;
const E = {land:"power3.out",soft:"power2.out",snap:"expo.out",settle:"back.out(1.15)",exit:"power2.in",throw:"power4.in",move:"power2.inOut"};
const tl = gsap.timeline({paused:true});

// ---- camera
gsap.set("#cam",{scale:1.14});
tl.to("#cam",{scale:1.05,duration:0.95,ease:"none"},0);
tl.to("#cam",{scale:1.0,duration:F(8),ease:E.snap},1.0);
tl.to("#cam",{scale:1.08,duration:F(7),ease:E.snap},2.44);
tl.to("#cam",{scale:1.12,duration:F(6),ease:E.snap},3.02);   // jump cut 1 (under B-roll)
tl.to("#cam",{scale:1.03,duration:F(6),ease:E.snap},4.88);   // jump cut 2
tl.to("#cam",{scale:1.10,duration:F(7),ease:E.snap},5.34);
tl.to("#cam",{scale:1.0,duration:F(8),ease:E.snap},6.46);
tl.to("#cam",{scale:1.13,duration:F(6),ease:E.snap},7.20);   // "lupa" punch
tl.to("#cam",{x:14,duration:F(2),yoyo:true,repeat:3,ease:"sine.inOut"},7.22);
tl.to("#cam",{scale:1.0,x:0,duration:F(9),ease:E.move},7.82);
tl.to("#cam",{scale:1.06,duration:0.6,ease:"none"},8.03);

// ---- captions
function capIn(sel,t,rot){tl.fromTo(sel,{opacity:0,scale:1.35,y:30,rotation:rot*1.6},{opacity:1,scale:1,y:0,rotation:rot,duration:F(8),ease:E.snap},t);}
function capShow(sel,t0,t1){tl.set(sel,{opacity:1},t0);tl.to(sel,{opacity:0,y:40,scale:.92,duration:F(4),ease:E.exit},t1);tl.set(sel,{opacity:0,y:0,scale:1},t1+F(5));}
capShow("#c1",0.0,0.92);  capIn("#c1a",0.0,-3);
capShow("#c2",1.0,2.16);  capIn("#c2a",1.0,-2); capIn("#c2b",1.28,2); capIn("#c2c",1.8,-1);
capShow("#c3",2.26,2.96); capIn("#c3a",2.26,-3); capIn("#c3b",2.44,2);
capShow("#c4",3.04,4.80); capIn("#c4a",3.04,-2); capIn("#c4b",3.52,2); capIn("#c4c",3.98,-1);
capShow("#c5",4.96,6.32); capIn("#c5a",4.96,-2); capIn("#c5b",5.34,2);
capShow("#c6",6.46,7.80); capIn("#c6a",6.46,-2); capIn("#c6b",7.20,-3);
tl.to("#c6b",{x:10,duration:F(2),yoyo:true,repeat:3,ease:"sine.inOut"},7.26);

// ---- bursts
function burst(sel,t,dur,dx){
  tl.fromTo(sel,{opacity:0,scale:1.6,x:dx,y:20},{opacity:1,scale:1,x:0,y:0,duration:F(7),ease:E.snap},t);
  tl.to(sel,{scale:1.06,duration:F(5),yoyo:true,repeat:3,ease:"sine.inOut"},t+F(8));
  tl.to(sel,{opacity:0,y:-30,duration:F(6),ease:E.exit},t+dur);
}
burst("#burst1",0.04,0.85,60);
burst("#burst2",2.44,0.5,-40);
burst("#burst3",7.86,0.7,60);

// ---- PART 2 stamp (hook)
tl.fromTo("#stamp",{opacity:0,scale:2.6,rotation:-18},{opacity:1,scale:1,rotation:-8,duration:F(7),ease:E.snap},0.04);
tl.fromTo("#flash",{opacity:0},{opacity:.5,duration:F(1)},0.06); tl.to("#flash",{opacity:0,duration:F(3)},0.06+F(1));
tl.to("#stamp",{opacity:0,x:-200,duration:F(6),ease:E.exit},0.9);

// ---- auto-debit calendar icon
tl.fromTo("#calico",{opacity:0,x:-220,rotation:-14},{opacity:1,x:0,rotation:-5,duration:F(10),ease:E.land},1.28);
tl.fromTo("#sync",{rotation:0,transformOrigin:"115px 153px"},{rotation:360,duration:0.9,ease:E.move},1.5);
tl.to("#calico",{opacity:0,x:-200,duration:F(6),ease:E.exit},2.2);

// ---- B-roll auto-debit app (J/L: enters just after "takdelah" starts, out on cut 2)
tl.to("#stage",{filter:"blur(14px) brightness(.8)",duration:0.3,ease:E.soft},3.06);
tl.fromTo("#broll",{opacity:0,y:700,rotation:6},{opacity:1,y:0,rotation:-1.5,duration:F(12),ease:E.soft},3.06);
tl.to("#knob",{x:70,duration:F(6),ease:E.snap},3.32);
tl.to("#sw",{backgroundColor:"#2fd17a",duration:F(6)},3.32);
document.querySelectorAll(".mo").forEach((m,i)=>{
  const t=3.50+i*0.08;
  tl.to(m,{backgroundColor:"#c9f7d6",color:"#0d6b39",duration:F(4)},t);
  tl.fromTo(m.querySelector("svg"),{opacity:0,scale:1.8},{opacity:1,scale:1,duration:F(5),ease:E.snap},t);
});
